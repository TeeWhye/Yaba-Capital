{% extends 'base_app.html' %}

{% block title %}Reset Password · Yaba Capital{% endblock %}

{% block content %}

<main class="auth-wrap">
    <div class="auth-card">

        <h1>Set a new password</h1>

        <p class="sub">
            Enter your new password below.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Change password
            </button>
        </form>

    </div>
</main>

{% endblock %}
